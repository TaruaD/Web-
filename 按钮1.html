<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>升级按钮</title>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background: wheat;
        }

        .btn {
            position: relative;
            overflow: hidden;
            display: flex;
            width: 100px;
            height: 50px;
            justify-content: center;
            align-items: center;
            gap: 2px;
            border: none;
            background: black;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            border-radius: 8px;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
        }

        .btn::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 50px;
            background: #fff;
            mix-blend-mode: difference;
            border-radius: 50%;
            transform: translate(-100%, 50%);
            transition: 0.3s;
        }

        .btn:hover::before {
            transform: translate(0, 0);
            border-radius: 0;
        }
    </style>
</head>

<body>
    <button class="btn">
        <span>GO pro</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>
</body>

</html>
