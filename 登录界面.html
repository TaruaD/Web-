<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      min-height: 100vh;
    }
  input{
    width: 200px;
    padding: 8px 10px;
    border: 1px solid #cccccc;
    border-radius:6px;
    outline: none;
    cursor: text;
    vertical-align: middle;
  }
    form {
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      max-width: 90%;

    }
    button,input[type="button"]{
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #cccccc;
      background: #eeeeee;
      color: #393e46;
      cursor: pointer;
      outline: none;
      transition: 0.3s;

    }
    input[type="button"]:hover{
      background: #f5f5f5;
    }
    form div{
      margin: 15px 0;
      text-align: center;
    }
  </style>
</head>
<body>
      <form>
        <div><h2>登录</h2></div>
        <div>账号：<input type="text" name="" id=""></div>

       <div> 密码：<input type="password" name="" id></div>

        <div><input type="button" value="登录"> <input type="button" value="注册"></div>
      </form>
</body>
</html>
