<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <div>
            <input type="text" name="name" id="">
        </div>
        <div>
            <select>
                <option value="red">红色</option>
                <option value="green">绿色</option>
                <option value="blue">蓝色</option>
            </select>
        </div>

        <div>
            <input type="radio" name="gender" id="male" value="male" checked>男
            <input type="radio" name="gender" id="female" value="female">女
        </div>
        <div>
            <input type="checkbox" name="hobby" id="game" value="游戏">游戏
            <input type="checkbox" name="hobby" id="music" value="音乐">音乐
            <input type="checkbox" name="hobby" id="sports" value="运动">运动
        </div>
        <input type="submit" value="提交" id="btn">
    </form>
    <script>
        const btn = document.querySelector('#btn')
        btn.addEventListener("click", (e) => {
            e.preventDefault()
            console.log("Name:", document.querySelector('input[type="text"]').value)
            console.log("Gender:", document.querySelector('input[type="radio"]:checked').value);
            console.log("Color", document.querySelector('select').value)
            const checkboxs = document.querySelectorAll('input[type=checkbox]')
            console.log("爱好：");
            checkboxs.forEach((checkbox) => {
                if (checkbox.checked) {
                    console.log('-' + checkbox.value)
                }
            })

        })
    </script>
</body>

</html>
